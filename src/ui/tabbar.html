<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Figma</title>
    <link rel="stylesheet" href="tabbar.css" />
  </head>
  <body>
    <!-- 标签栏。整条是窗口拖拽区，交互控件单独标 no-drag。 -->
    <div id="strip">
      <!-- 给 macOS 红绿灯留的位置，全屏时由 body.fullscreen 收掉 -->
      <div id="traffic-gap"></div>

      <button id="home" class="icon-btn" type="button" title="首页">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path
            d="M2.5 7.2 8 2.6l5.5 4.6v6a.9.9 0 0 1-.9.9H3.4a.9.9 0 0 1-.9-.9z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.3"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <!-- 标签本身由 tabbar.js 渲染。首页不在其中 —— 它是底页，不是标签。 -->
      <div id="tabs"></div>

      <!-- 这里原来有一个 + 按钮。首页不占标签之后它和左边的首页按钮
           指向同一个页面，留着就是两个做同一件事的按钮；站在首页时点它
           更是没有任何反应，看起来像坏了。所以去掉了。 -->

      <!-- 最后一个控件右边的空白，保持可拖拽 -->
      <div id="drag-fill"></div>
    </div>

    <!-- 这里原来有一张「没有打开的标签页」的卡。首页改成常驻底页之后它永远不会
         露面了 —— 关掉最后一个标签就是回到首页，而首页会盖住这块地方。
         与其留一段看不见的 DOM，不如去掉。 -->

    <script src="tabbar.js"></script>
  </body>
</html>
